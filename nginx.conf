server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 server_tokens off;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 location = /health { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
 # add_header inside a location replaces the server-level ones, so repeat them
 location = /index.html { add_header Cache-Control 'no-store'; add_header X-Content-Type-Options nosniff always; add_header X-Frame-Options DENY always; add_header Referrer-Policy strict-origin-when-cross-origin always; }
 location ~ /\. { deny all; }
 location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control 'public, immutable'; add_header X-Content-Type-Options nosniff always; add_header X-Frame-Options DENY always; add_header Referrer-Policy strict-origin-when-cross-origin always; }
 location / { try_files $uri $uri/ /index.html; }
 gzip on;
 gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}
